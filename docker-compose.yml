version: '3.8'

services:
  # 1. TimescaleDB (PostgreSQL + time-series extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: predictive_timescaledb
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: predictive_maintenance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Mosquitto MQTT Broker (replaces Redis)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: predictive_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # 3. Backend (FastAPI + Python ML)
  backend:
    build:
      context: ./backend
    container_name: predictive_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@timescaledb:5432/predictive_maintenance
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    ports:
      - "4000:3000"
    depends_on:
      - timescaledb
      - mosquitto

  # 4. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
    container_name: predictive_frontend
    restart: always
    ports:
      - "4001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
