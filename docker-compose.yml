version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: predictive_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: predictive_maintenance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: predictive_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
