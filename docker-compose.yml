version: '3.8'

services:
  # 1. TimescaleDB (PostgreSQL + time-series extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: predictive_timescaledb
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: predictive_maintenance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: predictive_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # 3. OPC-UA Demo Server — Virtual PLC/SCADA
  #    Menggunakan Dockerfile terpisah yang hanya install asyncua (ringan)
  #    Tidak perlu install numpy, scikit-learn, dll seperti backend
  opcua-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.opcua    # <-- Dockerfile khusus, jauh lebih ringan
    container_name: predictive_opcua_server
    restart: always
    ports:
      - "4840:4840"   # OPC-UA default port (UA TCP Binary)

  # 4. Backend (FastAPI + Python ML)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile          # <-- Dockerfile backend penuh
    container_name: predictive_backend
    restart: always
    env_file:
      - .env
    ports:
      - "4000:3000"
    depends_on:
      - timescaledb
      - mosquitto
      - opcua-server

  # 5. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
    container_name: predictive_frontend
    restart: always
    ports:
      - "4001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
