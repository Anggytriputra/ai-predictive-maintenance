name: Production Deployment (AWS EC2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2 Production
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            if [ ! -d "ai-predictive-maintenance" ]; then
              git clone https://github.com/Anggytriputra/ai-predictive-maintenance.git
            fi
            cd ai-predictive-maintenance
            git pull origin main
            
            # Configure environment variables from GitHub Secrets
            echo "DATABASE_URL=postgresql://admin:adminpassword@timescaledb:5432/predictive_maintenance" > .env
            echo "MQTT_BROKER_HOST=mosquitto" >> .env
            echo "MQTT_BROKER_PORT=1883" >> .env
            echo "NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" >> .env
            
            sudo docker compose up -d --build

      - name: Send Email Notification on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 [URGENT] Deployment Failed: ai-predictive-maintenance"
          to: anggytriasaputra@gmail.com
          cc: baru9910@gmail.com
          from: GitHub Actions AWS Bot
          body: "Hello Team,\n\nThe continuous deployment pipeline for ai-predictive-maintenance has FAILED on the production AWS server.\nPlease check the GitHub Actions logs immediately to identify and resolve the issue.\n\nBest regards,\nGitHub Actions Automated Deployer"
