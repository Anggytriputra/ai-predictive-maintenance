name: Backend CI (Satpam Pengecek Kode BE)

# Bekerja setiap ada 'git push' atau PR ke branch 'main'
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Mengecek Backend (Python FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Di sini Anda bisa menambahkan script pytest jika sudah ada unit test
      - name: Test Syntax
        working-directory: ./backend
        run: python -m compileall .
