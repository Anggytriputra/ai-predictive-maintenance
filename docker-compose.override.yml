version: '3.8'

services:
  backend:
    command: uvicorn app.main:socket_app --host 0.0.0.0 --port 3000 --reload
    volumes:
      - ./backend:/app
      
  frontend:
    image: node:20-alpine
    command: sh -c "npm install && npm run dev"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
